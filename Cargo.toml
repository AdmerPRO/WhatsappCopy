[package]
name = "WhatsappCopy"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "=0.5.3", features = ["std", "rand"] }
axum = { version = "0.8.9", features = ["ws", "json", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = "11.1.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid", "derive", "migrate"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "full"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
